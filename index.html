<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><aside><h1>◉ Circle</h1><p>Your little corner.</p><section id="auth"><h2>Welcome</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign in</button><button id="signup" class="alt">Create account</button></section><section id="user" hidden><p id="who"></p><button id="signout" class="alt">Sign out</button><h3>Your groups</h3><div id="groups"></div><button id="create">＋ Create group</button></section><small>No voice calls. Voice messages and attachments are planned next.</small></aside><section class="chat"><header><div><h2 id="title">Your Circle</h2><p>Private space for four friends</p></div><button id="refresh" class="alt">↻</button></header><div id="messages"></div><form id="sendform" hidden><select id="expiry"><option value="0">Never disappears</option><option value="60">1 minute</option><option value="3600">1 hour</option><option value="86400">24 hours</option><option value="604800">7 days</option></select><textarea id="message" placeholder="Write a message…" required maxlength="4000"></textarea><button>Send ↗</button></form></section></main><div id="notice"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
