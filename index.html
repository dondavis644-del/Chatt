
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Chatt</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <aside>
      <h1>◉ Chatt</h1>
      <p>Your little corner.</p>

      <section id="auth">
        <h2>Welcome to Chatt</h2>
        <p>Sign in to chat with your friends.</p>

        <button
          id="google"
          class="alt"
          type="button">
          Continue with Google
        </button>

        <div class="divider">or use email</div>

        <form id="loginform">
          <input
            id="email"
            type="email"
            placeholder="Email address"
            autocomplete="email"
            required>

          <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required>

          <button id="signin" type="button">
            Sign in
          </button>

          <button
            id="signup"
            class="alt"
            type="button">
            Create account
          </button>
        </form>
      </section>

      <section id="user" hidden>
        <p id="who"></p>

        <button
          id="signout"
          class="alt"
          type="button">
          Sign out
        </button>

        <h3>Your groups</h3>
        <div id="groups"></div>

        <button id="create" type="button">
          + Create group
        </button>
      </section>

      <small>
        Your space to connect with friends.
      </small>
    </aside>

    <section class="chat">
      <header>
        <div>
          <h2 id="title">Your Chatt</h2>
          <p>Private space for your friends</p>
        </div>

        <button
          id="refresh"
          class="alt"
          type="button"
          aria-label="Refresh messages">
          ↻
        </button>
      </header>

      <div id="messages"></div>

      <form id="sendform" hidden>
        <select id="expiry">
          <option value="0">Never disappears</option>
          <option value="60">1 minute</option>
          <option value="3600">1 hour</option>
          <option value="86400">24 hours</option>
          <option value="604800">7 days</option>
        </select>

        <textarea
          id="message"
          placeholder="Write a message..."
          required
          maxlength="4000"></textarea>

        <button type="submit">Send ↗</button>
      </form>
    </section>

  </main>

  <div id="notice" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
